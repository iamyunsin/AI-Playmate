[package]
name        = "ai-playmate-desktop"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Required by Tauri v2: expose both a dylib (mobile) and rlib (tests)
[lib]
name       = "ai_playmate_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Internal crates
ai-playmate-core    = { workspace = true }
ai-playmate-memory  = { workspace = true }
ai-playmate-storage = { workspace = true }

# Utilities
uuid = { workspace = true }
